<div class="absolute top-1/2 left-1/2 flex -translate-x-1/2 gap-6">
  <div class="flex gap-2">
    @if (cards$ | async; as cards) {
      @for (card of cards; track card) {
        <app-card
          [variant]="card"
          [owner]="CARD_OWNER_ENUM.TABLE"
          animate.enter="fade-in"
          animate.leave="fade-out"
        />
      }
    }
  </div>

  <div class="relative w-30">
    <app-card
      [variant]="CARD_ENUM.BACK"
      [owner]="CARD_OWNER_ENUM.TABLE"
      class="absolute inset-0 z-0"
    />
    <app-card
      [variant]="CARD_ENUM.BACK"
      [owner]="CARD_OWNER_ENUM.TABLE"
      class="absolute inset-0 z-10 translate-px"
    />
    <app-card
      [variant]="CARD_ENUM.BACK"
      [owner]="CARD_OWNER_ENUM.TABLE"
      class="absolute inset-0 z-20 translate-0.5"
    />
  </div>
</div>

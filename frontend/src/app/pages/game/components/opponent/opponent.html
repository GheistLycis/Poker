<div class="flex flex-col items-start">
  @if (opponent$ | async; as opponent) {
    <p
      [ngClass]="{ 'text-red-700': isOpponentTurn$ | async }"
      class="max-w-[13ch] truncate font-semibold"
    >
      {{ opponent.name }}
    </p>
    <app-cards-hand [player]="opponent" [isUser]="false" />
    <p>{{ opponent.score | currency }}</p>
  } @else {
    <div class="h-12 w-18 rounded-full bg-black/25"></div>
  }
</div>

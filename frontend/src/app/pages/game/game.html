@let winners = roundWinners();

<div class="relative h-svh overflow-hidden">
  <img id="background" ngSrc="background.jpg" alt="background" fill priority />

  <app-audio-hud />

  @for (opponentSeat of this.opponentsSeats(); track opponentSeat.seat) {
    <div
      [style.left]="opponentSeat.left"
      [style.top]="opponentSeat.top"
      class="absolute w-max -translate-1/2"
    >
      <app-opponent [seat]="opponentSeat.seat" [roundWinners]="winners" />
    </div>
  }

  <app-table [roundWinners]="winners" />

  <app-pot />

  <app-user [roundWinners]="winners" />
</div>

<div class="flex flex-col items-start">
  @if (opponent$ | async; as opponent) {
    <p
      class="max-w-[13ch] truncate font-semibold"
      [ngClass]="{ 'text-red-700': isOpponentTurn$ | async }"
    >
      {{ opponent.name }}
    </p>
    <app-cards-hand [seat]="seat()" />
    <p>{{ opponent.score | currency }}</p>
  }
</div>

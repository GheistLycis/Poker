<img
  priority
  [alt]="variant()"
  [ngSrc]="'cards/' + variant() + cardImgFileType()"
  [width]="owner() === CARD_OWNER_ENUM.OPPONENT ? 70 : 120"
  [height]="owner() === CARD_OWNER_ENUM.OPPONENT ? 140 : 240"
  [ngClass]="{
    'duration-300 ease-out hover:-translate-y-2 hover:opacity-80': variant() !== CARD_ENUM.BACK,
  }"
  [class]="class()"
/>

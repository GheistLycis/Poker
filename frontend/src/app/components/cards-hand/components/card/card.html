<img
  priority
  [alt]="variant()"
  [ngSrc]="'cards/' + variant() + cardImgFileType()"
  [width]="owner() === CARD_OWNER_ENUM.OPPONENT ? 60 : 120"
  [height]="owner() === CARD_OWNER_ENUM.OPPONENT ? 120 : 240"
  [ngClass]="{
    'duration-300 ease-out hover:-translate-y-2 hover:opacity-80': owner() === CARD_OWNER_ENUM.USER,
  }"
  [class]="class()"
/>

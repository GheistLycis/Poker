<div class="w-full flex gap-2 justify-center">
  <p class="font-bold text-lg">{{ seat() }}</p>
  @if (hand$ | async; as hand) {
    @for (card of hand; track $index) {
      <app-card
        [variant]="card ?? CARD_ENUM.BACK"
        [owner]="seat() == 0 ? CARD_OWNER_ENUM.USER : CARD_OWNER_ENUM.OPPONENT"
        animate.enter="push-card"
      />
    }
  }
</div>
